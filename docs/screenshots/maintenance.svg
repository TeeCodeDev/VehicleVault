  <rect x="740" y="410" width="180" height="42" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
  <text x="830" y="428" fill="#10b981" font-size="11" font-weight="800" text-anchor="middle">✓ In Orde (36%)</text>
  <text x="830" y="443" fill="#cbd5e1" font-size="10" text-anchor="middle">Nog 38.000 km of 32 mnd</text>

  <!-- Bottom Action Bar -->
