  <rect x="40" y="200" width="900" height="82" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="228" fill="#ffffff" font-size="14" font-weight="800">Motorolie &amp; Oliefilter (5W-30 LL)</text>
