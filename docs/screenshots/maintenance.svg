  <!-- Interval 3: Bougies & Luchtfilter (Green - Good) -->
  <rect x="40" y="390" width="900" height="82" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="418" fill="#ffffff" font-size="14" font-weight="800">Iridium Bougies &amp; Interieurfilter</text>
