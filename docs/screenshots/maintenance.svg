  <text x="150" y="522" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">+ Onderhoud Registreren</text>

  <rect x="275" y="495" width="220" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="385" y="522" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">📖 Download PDF Dossier</text>
