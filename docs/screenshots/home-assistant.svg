<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Home Assistant Window Frame -->
  <rect x="20" y="20" width="960" height="560" rx="16" fill="#101826" stroke="#1f2937" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header -->
  <rect x="20" y="20" width="960" height="44" rx="16" fill="#182232"/>
  <circle cx="44" cy="42" r="6" fill="#ef4444"/>
  <circle cx="64" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="42" r="6" fill="#10b981"/>
  <text x="500" y="46" fill="#03a9f4" font-size="12" font-weight="700" text-anchor="middle">🏠 Home Assistant — VehicleVault Telemetrie Dashboard</text>
  <line x1="20" y1="64" x2="980" y2="64" stroke="#1f2937" stroke-width="1"/>

  <!-- Left Sidebar (Home Assistant Style) -->
  <rect x="20" y="64" width="70" height="516" fill="#111927"/>
  <circle cx="55" cy="100" r="14" fill="#03a9f4"/>
  <text x="55" y="105" fill="#ffffff" font-size="14" text-anchor="middle">🚗</text>
  <circle cx="55" cy="150" r="14" fill="#1e293b"/>
  <text x="55" y="155" fill="#94a3b8" font-size="14" text-anchor="middle">⚡</text>
  <circle cx="55" cy="200" r="14" fill="#1e293b"/>
  <text x="55" y="205" fill="#94a3b8" font-size="14" text-anchor="middle">📊</text>

  <!-- Lovelace Dashboard Header -->
  <text x="120" y="105" fill="#ffffff" font-size="20" font-weight="800">Auto Telemetrie &amp; Sensoren</text>
  <text x="120" y="125" fill="#94a3b8" font-size="12">Live gesynchroniseerd via VehicleVault REST Sensors API (Polling: 300s)</text>

  <!-- Entity Cards Grid -->
  <!-- Card 1: Kilometerstand -->
  <rect x="120" y="150" width="250" height="110" rx="12" fill="#1b2434" stroke="#2d3748" stroke-width="1"/>
  <text x="140" y="180" fill="#03a9f4" font-size="16">⏲️</text>
  <text x="165" y="180" fill="#94a3b8" font-size="12" font-weight="600">sensor.vehicle_odometer</text>
  <text x="140" y="224" fill="#ffffff" font-size="26" font-weight="900">65.420 <tspan font-size="14" font-weight="600" fill="#03a9f4">km</tspan></text>
  <text x="140" y="246" fill="#10b981" font-size="10" font-weight="600">Bijgewerkt: 2 minuten geleden</text>

  <!-- Card 2: APK Dagen Resterend -->
  <rect x="390" y="150" width="250" height="110" rx="12" fill="#1b2434" stroke="#2d3748" stroke-width="1"/>
  <text x="410" y="180" fill="#10b981" font-size="16">🛡️</text>
  <text x="435" y="180" fill="#94a3b8" font-size="12" font-weight="600">sensor.vehicle_apk_days</text>
  <text x="410" y="224" fill="#10b981" font-size="26" font-weight="900">367 <tspan font-size="14" font-weight="600" fill="#cbd5e1">dagen</tspan></text>
  <text x="410" y="246" fill="#94a3b8" font-size="10" font-weight="600">APK Geldig t/m 31-10-2027</text>

  <!-- Card 3: Gemiddeld Verbruik -->
  <rect x="660" y="150" width="250" height="110" rx="12" fill="#1b2434" stroke="#2d3748" stroke-width="1"/>
  <text x="680" y="180" fill="#f59e0b" font-size="16">⛽</text>
  <text x="705" y="180" fill="#94a3b8" font-size="12" font-weight="600">sensor.vehicle_fuel_consumption</text>
  <text x="680" y="224" fill="#ffffff" font-size="26" font-weight="900">6,4 <tspan font-size="14" font-weight="600" fill="#f59e0b">L/100km</tspan></text>
  <text x="680" y="246" fill="#94a3b8" font-size="10" font-weight="600">1 op 15,6 • Rolling Average</text>

  <!-- Configuration YAML Preview Box -->
  <rect x="120" y="280" width="790" height="270" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  
  <rect x="120" y="280" width="790" height="36" rx="12" fill="#161b22"/>
  <rect x="120" y="300" width="790" height="16" fill="#161b22"/>
  <text x="140" y="303" fill="#8b949e" font-size="11" font-weight="700">configuration.yaml (1-Klik Kopieerbaar vanuit VehicleVault)</text>
  <line x1="120" y1="316" x2="910" y2="316" stroke="#30363d"/>

  <text x="140" y="340" fill="#79c0ff" font-size="12" font-family="monospace">rest:</text>
  <text x="160" y="360" fill="#79c0ff" font-size="12" font-family="monospace">- resource: <tspan fill="#a5d6ff">http://vehiclevault:3001/api/integrations/ha/sensors</tspan></text>
  <text x="180" y="380" fill="#79c0ff" font-size="12" font-family="monospace">scan_interval: <tspan fill="#79c0ff">300</tspan></text>
  <text x="180" y="400" fill="#79c0ff" font-size="12" font-family="monospace">headers:</text>
  <text x="200" y="420" fill="#79c0ff" font-size="12" font-family="monospace">x-api-key: <tspan fill="#ff7b72">"vkv_live_9a7d8e..."</tspan></text>
  <text x="180" y="440" fill="#79c0ff" font-size="12" font-family="monospace">sensor:</text>
  <text x="200" y="460" fill="#79c0ff" font-size="12" font-family="monospace">- name: <tspan fill="#a5d6ff">"Auto Tellerstand"</tspan></text>
  <text x="220" y="480" fill="#79c0ff" font-size="12" font-family="monospace">value_template: <tspan fill="#ff7b72">"{{ value_json.vehicles[0].odometer }}"</tspan></text>
  <text x="220" y="500" fill="#79c0ff" font-size="12" font-family="monospace">unit_of_measurement: <tspan fill="#a5d6ff">"km"</tspan></text>
  <text x="220" y="520" fill="#79c0ff" font-size="12" font-family="monospace">icon: <tspan fill="#a5d6ff">"mdi:counter"</tspan></text>
</svg>