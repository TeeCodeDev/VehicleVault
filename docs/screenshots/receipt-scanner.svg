<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="aiBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Modal Backdrop Overlay -->
  <rect x="0" y="0" width="1000" height="600" rx="16" fill="#020617" opacity="0.85"/>

  <!-- Modal Dialog Window -->
  <rect x="180" y="40" width="640" height="520" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Modal Header -->
  <rect x="180" y="40" width="640" height="60" rx="16" fill="#1e293b"/>
  <rect x="180" y="80" width="640" height="20" fill="#1e293b"/>
  <line x1="180" y1="100" x2="820" y2="100" stroke="#334155" stroke-width="1"/>

  <rect x="204" y="56" width="32" height="32" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="220" y="77" fill="#f59e0b" font-size="16" font-weight="900" text-anchor="middle">📷</text>
  
  <text x="250" y="71" fill="#ffffff" font-size="15" font-weight="800">AI Kassabon Scanner &amp; OCR</text>
  <text x="250" y="87" fill="#94a3b8" font-size="11">Herkent automatisch liters, prijs/L, bedrag, datum en tankstation</text>

  <!-- AI Engine Pill -->
  <rect x="655" y="57" width="145" height="26" rx="6" fill="url(#aiBadge)"/>
  <text x="727" y="74" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">✨ Google Gemini Vision</text>

  <!-- Split View Content -->
  <!-- Left: Receipt Preview Mockup -->
  <rect x="204" y="120" width="230" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Receipt Paper Styling -->
  <text x="319" y="150" fill="#0f172a" font-size="13" font-weight="900" text-anchor="middle">FIETEN OLIE</text>
  <text x="319" y="165" fill="#475569" font-size="9" text-anchor="middle">Stationsplein 1 • Utrecht</text>
  <line x1="220" y1="175" x2="418" y2="175" stroke="#94a3b8" stroke-dasharray="3,3"/>

  <text x="224" y="195" fill="#475569" font-size="10">DATUM: 28-10-2026</text>
  <text x="224" y="210" fill="#475569" font-size="10">POMP 03: Euro 95 E10</text>
  
  <line x1="220" y1="225" x2="418" y2="225" stroke="#cbd5e1"/>
  <text x="224" y="245" fill="#0f172a" font-size="11" font-weight="700">Volume (L):</text>
  <text x="414" y="245" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">42,50 L</text>
  
  <text x="224" y="265" fill="#0f172a" font-size="11">Prijs / Liter:</text>
  <text x="414" y="265" fill="#0f172a" font-size="11" text-anchor="end">€ 1,949</text>
  
  <line x1="220" y1="280" x2="418" y2="280" stroke="#0f172a" stroke-width="1.5"/>
  <text x="224" y="305" fill="#0f172a" font-size="13" font-weight="900">TOTAAL EUR:</text>
  <text x="414" y="305" fill="#0f172a" font-size="14" font-weight="900" text-anchor="end">€ 82,83</text>

  <!-- Scan Target Box -->
  <rect x="216" y="232" width="206" height="84" rx="4" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="319" y="335" fill="#0284c7" font-size="10" font-weight="700" text-anchor="middle">✓ AI Herkenning geslaagd (99%)</text>

  <!-- Right: Extracted Form Fields -->
  <rect x="450" y="120" width="350" height="360" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <text x="470" y="146" fill="#38bdf8" font-size="12" font-weight="800">AUTOMATISCH UITGELEZEN WAARDEN</text>

  <!-- Field 1: Datum -->
  <text x="470" y="176" fill="#94a3b8" font-size="10" font-weight="600">Datum Tankbeurt</text>
  <rect x="470" y="184" width="310" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="482" y="206" fill="#ffffff" font-size="12" font-weight="700">28-10-2026</text>

  <!-- Field 2: Liters & Prijs Grid -->
  <text x="470" y="238" fill="#94a3b8" font-size="10" font-weight="600">Aantal Liters</text>
  <rect x="470" y="246" width="145" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="482" y="268" fill="#ffffff" font-size="13" font-weight="800">42,50 L</text>

  <text x="635" y="238" fill="#94a3b8" font-size="10" font-weight="600">Prijs per Liter</text>
  <rect x="635" y="246" width="145" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="647" y="268" fill="#ffffff" font-size="13" font-weight="800">€ 1,949</text>

  <!-- Field 3: Totaalbedrag -->
  <text x="470" y="300" fill="#94a3b8" font-size="10" font-weight="600">Totaalbedrag Betaald</text>
  <rect x="470" y="308" width="310" height="36" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="482" y="332" fill="#10b981" font-size="16" font-weight="900">€ 82,83</text>

  <!-- Field 4: Tankstation -->
  <text x="470" y="364" fill="#94a3b8" font-size="10" font-weight="600">Gedetecteerd Tankstation</text>
  <rect x="470" y="372" width="310" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="482" y="394" fill="#ffffff" font-size="11" font-weight="700">Fieten Olie • Stationsplein 1, Utrecht</text>

  <text x="470" y="430" fill="#10b981" font-size="10" font-weight="600">✓ Automatische foutcorrectie &amp; rekencontrole uitgevoerd</text>

  <!-- Footer Actions -->
  <line x1="180" y1="495" x2="820" y2="495" stroke="#334155" stroke-width="1"/>
  <rect x="580" y="510" width="220" height="36" rx="8" fill="url(#primaryGrad)"/>
  <text x="690" y="533" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">✓ Overnemen in Tankbeurt</text>
  <text x="520" y="533" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Annuleren</text>
</svg>