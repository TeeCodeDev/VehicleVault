<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fuelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="apkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="20" width="960" height="560" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header -->
  <rect x="20" y="20" width="960" height="44" rx="16" fill="#1e293b"/>
  <rect x="20" y="50" width="960" height="14" fill="#1e293b"/>
  <line x1="20" y1="64" x2="980" y2="64" stroke="#334155" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="44" cy="42" r="6" fill="#ef4444"/>
  <circle cx="64" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="42" r="6" fill="#10b981"/>

  <text x="500" y="46" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">VehicleVault — Dashboard &amp; Wagenparkbeheer</text>

  <!-- Top Navigation Bar -->
  <rect x="20" y="64" width="960" height="56" fill="#0f172a"/>
  <line x1="20" y1="120" x2="980" y2="120" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Brand -->
  <rect x="40" y="78" width="28" height="28" rx="6" fill="#0284c7"/>
  <path d="M48 88 L54 94 L62 84" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="76" y="96" fill="#ffffff" font-size="15" font-weight="800" letter-spacing="-0.3">VehicleVault</text>

  <!-- Nav Tabs -->
  <rect x="210" y="80" width="86" height="26" rx="6" fill="#1e293b"/>
  <text x="253" y="97" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Dashboard</text>
  <text x="330" y="97" fill="#94a3b8" font-size="11" font-weight="600">Tanken</text>
  <text x="395" y="97" fill="#94a3b8" font-size="11" font-weight="600">Onderhoud</text>
  <text x="480" y="97" fill="#94a3b8" font-size="11" font-weight="600">Banden</text>
  <text x="545" y="97" fill="#94a3b8" font-size="11" font-weight="600">Ritten</text>
  <text x="605" y="97" fill="#94a3b8" font-size="11" font-weight="600">Documenten</text>

  <!-- User Status Badge -->
  <rect x="850" y="80" width="105" height="26" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="865" cy="93" r="4" fill="#10b981"/>
  <text x="906" y="97" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">demo@vault</text>

  <!-- Main Content Header -->
  <text x="40" y="152" fill="#ffffff" font-size="18" font-weight="800">Volkswagen Golf GTI 2.0 TSI</text>
  
  <!-- License Plate Badge -->
  <rect x="40" y="164" width="94" height="26" rx="5" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  <rect x="41" y="165" width="16" height="24" rx="4" fill="#1d4ed8"/>
  <text x="49" y="181" fill="#ffffff" font-size="8" font-weight="900" text-anchor="middle">NL</text>
  <text x="96" y="182" fill="#0f172a" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">GB-123-K</text>

  <!-- Specs Badges -->
  <rect x="144" y="164" width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="208" y="181" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">APK t/m 31-10-2027</text>

  <rect x="280" y="164" width="88" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="324" y="181" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">Energielabel C</text>

  <rect x="376" y="164" width="112" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="432" y="181" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">180 kW / 245 PK</text>

  <!-- Metric KPI Cards (Row 1) -->
  <!-- Card 1: Kilometerstand -->
  <rect x="40" y="206" width="215" height="96" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="56" y="230" fill="#94a3b8" font-size="10" font-weight="700" text-transform="uppercase">HUIDIGE KILOMETERSTAND</text>
  <text x="56" y="266" fill="#ffffff" font-size="24" font-weight="800">65.420 <tspan font-size="13" font-weight="500" fill="#94a3b8">km</tspan></text>
  <text x="56" y="288" fill="#10b981" font-size="10" font-weight="600">+1.240 km deze maand</text>

  <!-- Card 2: Gemiddeld Verbruik -->
  <rect x="270" y="206" width="215" height="96" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="286" y="230" fill="#94a3b8" font-size="10" font-weight="700" text-transform="uppercase">GEMIDDELD VERBRUIK</text>
  <text x="286" y="266" fill="#38bdf8" font-size="24" font-weight="800">6,4 <tspan font-size="13" font-weight="500" fill="#94a3b8">L/100km</tspan></text>
  <text x="286" y="288" fill="#94a3b8" font-size="10" font-weight="600">1 op 15,6 • Benzine E10</text>

  <!-- Card 3: Totale Kosten (TCO) -->
  <rect x="500" y="206" width="215" height="96" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="516" y="230" fill="#94a3b8" font-size="10" font-weight="700" text-transform="uppercase">KOSTEN PER KILOMETER</text>
  <text x="516" y="266" fill="#10b981" font-size="24" font-weight="800">€ 0,28 <tspan font-size="13" font-weight="500" fill="#94a3b8">/ km</tspan></text>
  <text x="516" y="288" fill="#94a3b8" font-size="10" font-weight="600">Inclusief brandstof &amp; vaste lasten</text>

  <!-- Card 4: Onderhoudsstatus -->
  <rect x="730" y="206" width="225" height="96" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="746" y="230" fill="#94a3b8" font-size="10" font-weight="700" text-transform="uppercase">VOLGEND ONDERHOUD</text>
  <text x="746" y="264" fill="#fbbf24" font-size="18" font-weight="800">Motorolie &amp; Filter</text>
  <rect x="746" y="276" width="190" height="6" rx="3" fill="#334155"/>
  <rect x="746" y="276" width="140" height="6" rx="3" fill="#fbbf24"/>
  <text x="746" y="294" fill="#94a3b8" font-size="9" font-weight="600">Nog 3.200 km of 4 maanden</text>

  <!-- Visual Section: Chart Mockup & Recent Log -->
  <!-- Left Column: Spend & Consumption Trends -->
  <rect x="40" y="318" width="550" height="238" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="56" y="344" fill="#ffffff" font-size="13" font-weight="700">Brandstofprijs &amp; Verbruiksevolutie (Laatste 6 Maanden)</text>
  
  <!-- Simplified Graph Lines -->
  <polyline points="70,470 140,450 210,460 280,420 350,430 420,390 500,410 550,380" fill="none" stroke="#0284c7" stroke-width="3"/>
  <polyline points="70,510 140,500 210,515 280,490 350,495 420,480 500,485 550,470" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Graph Dots -->
  <circle cx="280" cy="420" r="4" fill="#38bdf8"/>
  <circle cx="420" cy="390" r="4" fill="#38bdf8"/>
  <circle cx="550" cy="380" r="5" fill="#38bdf8"/>
  
  <!-- Graph Legend -->
  <circle cx="65" cy="535" r="4" fill="#0284c7"/>
  <text x="75" y="538" fill="#94a3b8" font-size="10">Verbruik (L/100km)</text>
  <circle cx="185" cy="535" r="4" fill="#f59e0b"/>
  <text x="195" y="538" fill="#94a3b8" font-size="10">Brandstofprijs (€/L)</text>

  <!-- Right Column: Recent Activities & Fast Action -->
  <rect x="605" y="318" width="350" height="238" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="621" y="344" fill="#ffffff" font-size="13" font-weight="700">Recente Gebeurtenissen</text>

  <!-- Activity 1 -->
  <rect x="621" y="360" width="318" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
  <text x="633" y="380" fill="#ffffff" font-size="11" font-weight="700">Tanken: 45,20 L • € 88,14</text>
  <text x="633" y="398" fill="#94a3b8" font-size="10">Shell Express • 65.420 km • Gisteren</text>
  <rect x="880" y="374" width="45" height="22" rx="4" fill="#0284c7"/>
  <text x="902" y="389" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Bon 📄</text>

  <!-- Activity 2 -->
  <rect x="621" y="420" width="318" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.75"/>
  <text x="633" y="440" fill="#ffffff" font-size="11" font-weight="700">Zomerbandenset gemonteerd</text>
  <text x="633" y="458" fill="#94a3b8" font-size="10">Michelin Pilot Sport 4 • 6,5 mm profiel</text>
  <text x="895" y="450" fill="#10b981" font-size="10" font-weight="700">Actief</text>

  <!-- Activity 3: Quick Action Button -->
  <rect x="621" y="482" width="318" height="56" rx="8" fill="url(#primaryGrad)"/>
  <text x="780" y="515" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">+ Nieuwe Tankbeurt / Bon Scannen</text>
</svg>