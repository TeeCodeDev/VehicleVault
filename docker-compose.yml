services:
  vehiclevault:
    image: ghcr.io/teecodedev/vehiclevault:latest
    # Uncomment 'build' below only if you cloned the full repository and want to build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: vehiclevault
    restart: unless-stopped
    ports:
      - "3084:3084"
    environment:
      - NODE_ENV=production
      - PORT=3084
      - DATA_DIR=/data
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_random_secure_secret_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_to_another_random_secure_secret}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3084/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
