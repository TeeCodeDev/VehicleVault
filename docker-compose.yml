services:
  vehiclevault:
    image: ghcr.io/teecodedev/vehiclevault:latest
    # Uncomment 'build' below only if you cloned the full repository and want to build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # container_name: vehiclevault # (Optional: omit to prevent container naming conflicts during updates in Dockhand/Portainer)
    restart: unless-stopped
    ports:
      # Host port : Container internal port (change PORT in .env to change the host port, e.g. PORT=8080)
      - "${PORT:-3084}:3084"
    environment:
      - NODE_ENV=production
      - PORT=3084
      - DATA_DIR=/data
      # Optional, for passkeys behind a reverse proxy (see docs/wiki/Notifications-and-Security.md)
      - RP_ID=${RP_ID:-}
      - RP_ORIGINS=${RP_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_random_secure_secret_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_to_another_random_secure_secret}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3084/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
