name: Docker Build, Release & Wiki Sync

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Pre-Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish Official Release & Sync Wiki
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up legacy v1.0.x releases and publish v2.0.0 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove any legacy v1.0.x GitHub Releases
          for old_tag in $(gh release list --limit 50 --json tagName -q '.[].tagName' | grep '^v1\.0\.' || true); do
            echo "Deleting legacy release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done

          # Create or update the official v2.0.0 Release
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release edit v2.0.0 \
              --title "VehicleVault v2.0.0 — Official Production Release" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create v2.0.0 \
              --title "VehicleVault v2.0.0 — Official Production Release" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

      - name: Publish docs/wiki to GitHub Wiki (if initialized)
        continue-on-error: true
        run: |
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          if git clone "$WIKI_URL" /tmp/wiki_repo 2>/dev/null; then
            cp -r docs/wiki/*.md /tmp/wiki_repo/
            cd /tmp/wiki_repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "docs(wiki): sync VehicleVault v2.0.0 documentation"
              git push origin HEAD
            fi
          else
            echo "GitHub Wiki git repo not yet initialized via UI; docs/wiki is available directly in the main repository."
          fi
